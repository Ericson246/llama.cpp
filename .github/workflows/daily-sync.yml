name: Daily Sync & Release

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Setup git user
        run: |
          git config user.name "daily-sync[bot]"
          git config user.email "daily-sync[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp.git
          git fetch upstream master

      - name: Sync master
        run: |
          git checkout master
          git merge upstream/master
          git push origin master

      - name: Sync daily-sync.yml to master
        run: |
          git checkout master
          git checkout builds -- .github/workflows/daily-sync.yml 2>/dev/null || true
          git diff --quiet -- .github/workflows/daily-sync.yml || {
            git add .github/workflows/daily-sync.yml
            git commit -m "sync: update daily-sync.yml from builds"
            git push origin master
          }

      - name: Sync builds
        run: |
          git checkout builds
          git merge master --no-commit --no-ff || true
          # Resolve modify/delete conflicts: upstream files deleted in builds
          git rm -f .github/workflows/build-cache.yml .github/workflows/build-openvino.yml .github/workflows/build-self-hosted.yml 2>/dev/null || true
          # Keep our custom workflows (upstream may have changed release.yml)
          git checkout --ours -- .github/workflows/release.yml .github/workflows/daily-sync.yml 2>/dev/null || true
          git add .github/workflows/release.yml .github/workflows/daily-sync.yml
          # Resolve any remaining conflicts with ours
          if [ -n "$(git diff --name-only --diff-filter=U 2>/dev/null)" ]; then
            git checkout --ours -- $(git diff --name-only --diff-filter=U)
            git add .
          fi
          # Remove any NEW workflow files from upstream
          for f in $(git diff --cached --name-only --diff-filter=A -- .github/workflows/); do
            git rm --cached "$f" 2>/dev/null || true
            rm -f "$f" 2>/dev/null || true
          done
          git commit --no-edit || echo "Nothing to commit"
          git push origin builds

      - name: Sync npu-check
        continue-on-error: true
        run: |
          git checkout npu-check
          git rebase master
          git push origin npu-check --force-with-lease

      - name: Create daily tag
        id: tag
        run: |
          TAG_NAME="daily-$(date +'%Y-%m-%d')"
          git checkout builds
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "name=$TAG_NAME" >> $GITHUB_OUTPUT

name: Release

on:
  push:
    tags:
      - 'v*'
      - 'daily-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $vulkanVersion = "1.4.313.2"
          curl.exe -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" -L "https://sdk.lunarg.com/sdk/download/${vulkanVersion}/windows/vulkansdk-windows-X64-${vulkanVersion}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${vulkanVersion}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${vulkanVersion}\bin"

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DGGML_VULKAN=ON
          -DLLAMA_BUILD_APP=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON
          -DLLAMA_BUILD_TESTS=OFF
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-server-windows-x64
          path: build/bin/Release/llama-server.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Vulkan SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq vulkan-sdk

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DGGML_VULKAN=ON
          -DLLAMA_BUILD_APP=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON
          -DLLAMA_BUILD_TESTS=OFF
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-server-linux-x64
          path: build/bin/llama-server
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DGGML_METAL=ON
          -DLLAMA_BUILD_APP=OFF
          -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON
          -DLLAMA_BUILD_TESTS=OFF
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-server-macos-arm64
          path: build/bin/llama-server
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK env
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Install NDK
        run: |
          echo "y" | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq vulkan-sdk
          echo "VULKAN_SDK=/usr" >> $GITHUB_ENV
          # Copy vulkan.hpp to NDK sysroot so the NDK cross-compiler can find it
          NDK_SYSROOT="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          sudo cp /usr/include/vulkan/vulkan.hpp "$NDK_SYSROOT/usr/include/vulkan/"
          sudo cp /usr/include/vulkan/vulkan_enums.hpp "$NDK_SYSROOT/usr/include/vulkan/" 2>/dev/null || true
          sudo cp /usr/include/vulkan/vulkan_funcs.hpp "$NDK_SYSROOT/usr/include/vulkan/" 2>/dev/null || true
          sudo cp /usr/include/vulkan/vulkan_handles.hpp "$NDK_SYSROOT/usr/include/vulkan/" 2>/dev/null || true
          sudo cp /usr/include/vulkan/vulkan_structs.hpp "$NDK_SYSROOT/usr/include/vulkan/" 2>/dev/null || true
          sudo cp /usr/include/vulkan/vulkan_to_string.hpp "$NDK_SYSROOT/usr/include/vulkan/" 2>/dev/null || true

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DGGML_VULKAN=ON
          -DGGML_BACKEND_DL=ON
          -DCMAKE_TOOLCHAIN_FILE=${{ env.ANDROID_NDK }}/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-28
          -DLLAMA_BUILD_APP=OFF
          -DVulkan_INCLUDE_DIR=/usr/include
          -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON
          -DLLAMA_BUILD_TESTS=OFF
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-server-android-arm64
          path: build/bin/llama-server
          if-no-files-found: error

  release:
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" \
            --title "llama-server $TAG" \
            --notes "See [CHANGELOG](CHANGELOG.md) for details." \
            --verify-tag
          find artifacts -type f -exec gh release upload "$TAG" {} \;
